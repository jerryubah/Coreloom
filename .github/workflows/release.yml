name: Release

# Builds, tests and packages Coreloom for Windows and macOS, then publishes a GitHub release with:
# - Windows: the installer and the portable zip;
# - macOS: a disk image and an update zip for Apple silicon and for Intel, each built, signed, checked and opened on a
#   Mac of that kind first (build/mac/verify-app.sh);
# - stable names for the download buttons (Coreloom-Windows-Setup.exe, Coreloom-macOS-Apple-Silicon.dmg,
#   Coreloom-macOS-Intel.dmg), so https://github.com/<repo>/releases/latest/download/<name> always gets the newest;
# - SHA256SUMS.txt for every file (the in-app updaters check their download against it).
# Three ways to start it:
# - Push to main with a new version heading in CHANGELOG.md (e.g. "## [1.3.0] - 2026-11-03"): if that version has
#   no tag yet, this workflow creates the tag on the pushed commit and publishes the release. This is the usual way.
# - Push a tag like v1.2.0 (or v1.3.0-beta.1 for a pre-release).
# - "Run workflow" on the Actions tab with an existing tag re-publishes the files for it.
# If a release for the tag already exists (e.g. it was created on GitHub's website), the files are added to it and
# its title and text are kept.
on:
  push:
    branches: [main]
    # Branch pushes only start a release check when the changelog (or this file) changed; tag pushes always run.
    paths: ['CHANGELOG.md', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write   # create the tag and release, upload assets

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      ref: ${{ steps.decide.outputs.ref }}
      new_tag: ${{ steps.decide.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Decide what to release
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash ./build/release-decide.sh

  mac:
    name: macOS app (${{ matrix.arch }})
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      # A Developer ID is optional: without these secrets the app is signed ad hoc (see docs/RELEASING.md).
      HAS_DEVELOPER_ID: ${{ secrets.MAC_CERT_P12 != '' && secrets.MAC_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test the macOS back-end on this Mac
        run: dotnet test tests/Coreloom.Hardware.Mac.Tests/Coreloom.Hardware.Mac.Tests.csproj -c Release

      - name: Install dmgbuild (lays out the disk image's window)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"

      - name: Load the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$RUNNER_TEMP" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # Builds, signs and packages the app, checks the packages as macOS and the updater will, then installs it, opens
      # every page and quits it. A release isn't published unless both Macs pass.
      - name: Build, package and verify
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
        run: bash build/mac/verify-app.sh ${{ matrix.arch }} artifacts/mac-verify ${{ needs.decide.outputs.version }}

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: macapp-${{ matrix.arch }}
          path: |
            artifacts/mac/*.zip
            artifacts/mac/*.dmg
          if-no-files-found: error

      - name: Upload what the check saw
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mac-verify-${{ matrix.arch }}-${{ needs.decide.outputs.version }}
          path: artifacts/mac-verify/
          if-no-files-found: ignore

  release:
    needs: [decide, mac]
    if: needs.decide.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: release-${{ needs.decide.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup could not be installed' }

      - name: Build, test and package
        shell: pwsh
        run: ./build/build.ps1 -Version ${{ needs.decide.outputs.version }} -Repository ${{ github.repository }} -Package -RequireInstaller

      # Hosted runners have no GPU or PawnIO; a failure here is reported but doesn't block the release
      # (CI runs the same check strictly on every push).
      - name: Smoke-test the published CoreloomDiag
        continue-on-error: true
        shell: pwsh
        run: ./artifacts/publish/win-x64/CoreloomDiag.exe --samples 2 --interval 500 --out artifacts/coreloomdiag-release.md

      - name: Add the Mac apps
        uses: actions/download-artifact@v6
        with:
          pattern: macapp-*
          merge-multiple: true
          path: artifacts/release

      # Stable names for the download buttons on the README and the website, and checksums for every file.
      - name: Download names and checksums
        shell: pwsh
        run: |
          $v = '${{ needs.decide.outputs.version }}'
          $dir = 'artifacts/release'
          $stable = [ordered]@{
            "Coreloom-$v-win-x64-Setup.exe" = 'Coreloom-Windows-Setup.exe'
            "Coreloom-$v-macos-arm64.dmg"   = 'Coreloom-macOS-Apple-Silicon.dmg'
            "Coreloom-$v-macos-x64.dmg"     = 'Coreloom-macOS-Intel.dmg'
          }
          foreach ($pair in $stable.GetEnumerator()) {
            $source = Join-Path $dir $pair.Key
            if (-not (Test-Path $source)) { throw "Missing $($pair.Key)" }
            Copy-Item $source (Join-Path $dir $pair.Value) -Force
          }
          foreach ($required in @("Coreloom-$v-macos-arm64.zip", "Coreloom-$v-macos-x64.zip", "Coreloom-$v-win-x64-Portable.zip")) {
            if (-not (Test-Path (Join-Path $dir $required))) { throw "Missing $required" }
          }
          $lines = Get-ChildItem $dir -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [System.IO.File]::WriteAllText((Join-Path $dir 'SHA256SUMS.txt'), (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content (Join-Path $dir 'SHA256SUMS.txt')
          Get-ChildItem $dir -File | ForEach-Object { '{0,-52} {1,10:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - name: Release notes
        shell: pwsh
        run: ./build/release-notes.ps1 -Version ${{ needs.decide.outputs.version }} -OutFile artifacts/release-notes.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.decide.outputs.tag }}'
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName })
          $existing = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed ($LASTEXITCODE)" }
          if ($existing -contains $tag) {
            # Created by hand (or an earlier run): add or replace the files, keep the title and text.
            Write-Host "Release $tag already exists; uploading its files."
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
            $body = gh release view $tag --json body --jq '.body'
            if ([string]::IsNullOrWhiteSpace(($body -join "`n"))) {
              # Coreloom's "What's new" summary is built from the release text, so don't leave it empty.
              gh release edit $tag --notes-file artifacts/release-notes.md
              if ($LASTEXITCODE -ne 0) { throw "gh release edit failed ($LASTEXITCODE)" }
            }
          }
          else {
            $ghArgs = @('release', 'create', $tag, '--title', 'Coreloom ${{ needs.decide.outputs.version }}',
                        '--notes-file', 'artifacts/release-notes.md')
            if ('${{ needs.decide.outputs.new_tag }}' -eq 'true') {
              # Started by a changelog push to main: the tag doesn't exist yet, so gh creates it on that commit.
              $ghArgs += @('--target', '${{ needs.decide.outputs.ref }}')
            }
            else {
              $ghArgs += '--verify-tag'
            }
            # A stable version becomes the repository's "Latest release", which the download buttons'
            # releases/latest/download/<name> links point to.
            if ('${{ needs.decide.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' } else { $ghArgs += '--latest' }
            gh @ghArgs @assets
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.decide.outputs.version }}
          path: |
            artifacts/release/
            artifacts/test-results/
            artifacts/coreloomdiag-release.md
          if-no-files-found: ignore
