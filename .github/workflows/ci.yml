name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  windows:
    name: Build, test & publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build, test and publish (self-contained)
        shell: pwsh
        run: ./build/build.ps1 -Configuration Release -Publish

      # A ready-to-run copy of every build: download "Coreloom-win-x64" from the run's Summary page,
      # unzip it and double-click Coreloom.exe (no .NET install needed).
      - name: Upload ready-to-run app
        uses: actions/upload-artifact@v6
        with:
          name: Coreloom-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Build without the LibreHardwareMonitor adapter
        shell: pwsh
        run: dotnet build src/Coreloom.Hardware/Coreloom.Hardware.csproj -c Release -p:CoreloomNoLhm=true -nologo

      # Hosted runners have no GPU and no PawnIO driver, so most sensors are expected to be unavailable.
      # This checks that the published diagnostic tool starts, polls and writes its report.
      - name: CoreloomDiag smoke run
        shell: pwsh
        run: |
          ./artifacts/publish/win-x64/CoreloomDiag.exe --samples 3 --interval 500 --out artifacts/coreloomdiag-ci.md
          if (-not (Test-Path artifacts/coreloomdiag-ci.md)) { throw 'CoreloomDiag did not write its report' }
          Get-Content artifacts/coreloomdiag-ci.md -TotalCount 60

      - name: Upload test results and diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-results
          path: |
            artifacts/test-results/
            artifacts/coreloomdiag-ci.md
          if-no-files-found: ignore

  linux:
    name: Core & view-model tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The platform-neutral layers must stay free of Windows dependencies.
      - name: Test Coreloom.Core
        run: dotnet test tests/Coreloom.Core.Tests/Coreloom.Core.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results

      - name: Test Coreloom.ViewModels
        if: success() || failure()
        run: dotnet test tests/Coreloom.ViewModels.Tests/Coreloom.ViewModels.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results

      # The macOS back-end's decoding and arithmetic (the tests that read a real Mac skip here).
      - name: Test Coreloom.Hardware.Mac (portable parts)
        if: success() || failure()
        run: dotnet test tests/Coreloom.Hardware.Mac.Tests/Coreloom.Hardware.Mac.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results

      # Each test project's counts as a notice and each failed test as an annotation on the run's summary page.
      - name: Test report
        if: always()
        run: python3 build/test-report.py artifacts/test-results

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Hosted Macs are virtual machines: real processor, memory, disk, network and GPU counters, but no temperature,
      # power or fan sensors. The readings report shows what this Mac gave.
      - name: Test the macOS back-end on this Mac
        env:
          CORELOOM_MAC_REPORT: ${{ github.workspace }}/artifacts/mac-readings-${{ matrix.arch }}.md
        run: dotnet test tests/Coreloom.Hardware.Mac.Tests/Coreloom.Hardware.Mac.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results

      - name: Show the readings
        if: always()
        run: cat artifacts/mac-readings-*.md 2>/dev/null | head -300 || true

      # The app as it ships: built, signed ad hoc and packaged (zip and disk image), checked the way macOS and the
      # updater will, then installed, opened on every page (screenshots) and quit.
      - name: Package and open the app
        if: success() || failure()
        run: |
          # dmgbuild lays out the disk image's window; if PyPI can't be reached, bundle.sh makes a plain image instead.
          if python3 -m venv "$RUNNER_TEMP/dmgbuild" && "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild; then
            export PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH"
          else
            echo "::warning title=dmgbuild::dmgbuild couldn't be installed; the disk image is a plain one"
          fi
          bash build/mac/verify-app.sh ${{ matrix.arch }} artifacts/mac-verify

      - name: Test report
        if: always()
        run: python3 build/test-report.py artifacts/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-results
          path: |
            artifacts/test-results/
            artifacts/mac-readings-*.md
            artifacts/mac-verify/
          if-no-files-found: ignore

      # A ready-to-open copy of every build (signed ad hoc): download "Coreloom-macos-<arch>" from the run's page.
      - name: Upload the disk image
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Coreloom-macos-${{ matrix.arch }}
          path: artifacts/mac/*.dmg
          if-no-files-found: ignore
          retention-days: 30
