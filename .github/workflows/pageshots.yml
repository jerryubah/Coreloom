name: Page shots

# Draws Coreloom's pages with sample data into PNGs (tools/Coreloom.PageShots), to check their layout on Windows:
# alignment, wrapping and spacing. A developer check only; nothing here is part of a release.
on:
  push:
    branches: ['shots-*']
  workflow_dispatch:

permissions:
  contents: write   # to publish the pictures on the pageshots-output branch

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  shots:
    name: Draw the pages (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Draw the pages
        shell: pwsh
        run: dotnet run --project tools/Coreloom.PageShots/Coreloom.PageShots.csproj -c Release -- artifacts/pageshots

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pageshots
          path: artifacts/pageshots/
          if-no-files-found: warn
          retention-days: 14

      # Also as a branch of their own (replaced each run), so they can be fetched with git where artifact downloads
      # aren't reachable.
      - name: Publish the pictures on the pageshots-output branch
        shell: pwsh
        run: |
          $source = "${{ github.sha }}".Substring(0, 7)
          Set-Location artifacts/pageshots
          git init -q -b pageshots-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Page shots of $source (${{ github.ref_name }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pageshots-output
          Get-ChildItem *.png | ForEach-Object { Write-Output "::notice title=Page shot::$($_.Name) $([math]::Round($_.Length / 1KB)) KB" }
